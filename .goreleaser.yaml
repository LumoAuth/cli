# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: lumo

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: lumo
    main: ./
    binary: lumo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/lumoauth/cli/cmd.Version={{.Version}}
      - -X github.com/lumoauth/cli/cmd.Commit={{.Commit}}
      - -X github.com/lumoauth/cli/cmd.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# --- Package-manager distribution -------------------------------------------
# One-time human setup required before the first release with these blocks:
#   1. Create the (empty) GitHub repos lumoauth/homebrew-tap and
#      lumoauth/scoop-bucket, and fork microsoft/winget-pkgs to
#      lumoauth/winget-pkgs.
#   2. Give the release workflow a GITHUB_TOKEN (classic PAT or fine-grained)
#      with `repo` (contents: write) on the tap/bucket repos and the
#      winget-pkgs fork — the default Actions token can't push to other repos.
# See README.md "Releasing" for details.

homebrew_casks:
  - name: lumo
    repository:
      owner: lumoauth
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://lumoauth.dev"
    description: "LumoAuth CLI — manage your organization's identity infrastructure"
    commit_author:
      name: lumoauth-team
      email: team@lumoauth.dev
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    binaries:
      - lumo
    generate_completions_from_executable:
      executable: lumo
      args: ["completion"]
    caveats: |
      Get started with:
        lumo login --org <your-org-slug>
    # The binaries aren't notarized, so strip the quarantine attribute or
    # Gatekeeper will refuse to run them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lumo"]
          end
    # Don't publish casks for release candidates / pre-releases.
    skip_upload: auto

scoops:
  - name: lumo
    repository:
      owner: lumoauth
      name: scoop-bucket
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://lumoauth.dev"
    description: "LumoAuth CLI — manage your organization's identity infrastructure"
    license: MIT
    commit_author:
      name: lumoauth-team
      email: team@lumoauth.dev
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: auto

winget:
  - name: lumo
    package_identifier: LumoAuth.lumo
    publisher: LumoAuth
    publisher_url: "https://lumoauth.dev"
    publisher_support_url: "https://github.com/lumoauth/cli/issues"
    short_description: "LumoAuth CLI — manage your organization's identity infrastructure"
    license: MIT
    homepage: "https://lumoauth.dev"
    commit_author:
      name: lumoauth-team
      email: team@lumoauth.dev
    commit_msg_template: "New version: {{ .PackageIdentifier }} {{ .Version }}"
    tags:
      - cli
      - auth
      - oauth
      - oidc
      - identity
    # Publish via PR from our fork to microsoft/winget-pkgs.
    repository:
      owner: lumoauth
      name: winget-pkgs
      branch: "{{ .ProjectName }}-{{ .Version }}"
      token: "{{ .Env.GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
